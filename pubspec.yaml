name: smart_farm_sheba
description: Smart Farm Sheba - Full Stack Agriculture Android App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ✅ State Management
  provider: ^6.1.2

  # ✅ Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # ✅ Google Sign-In
  google_sign_in: ^6.2.1

  # ✅ Date & Time
  intl: ^0.19.0

  # ✅ HTTP (for AI Chatbot API)
  http: ^1.2.2

  # ✅ Auto login remember
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true